<!doctype html>
<html><head><meta charset="utf-8"><title>Dashboard</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header>
  <div id="logo">MANUL</div>
  <nav><a href="/dashboard.html">Home</a> <a href="/forms.html">Forms</a> <a href="/widgets.html">Widgets</a> <a href="/catalog.html">Catalog</a></nav>
  <button id="logout">Logout</button>
</header>
<main>
  <h1 id="welcome">Welcome</h1>
  <section>
    <h2>Summary</h2>
    <label for="order-total">Order total</label><input id="order-total" readonly value="142.50">
    <label for="role">Role</label><input id="role" readonly value="member">
  </section>
  <section>
    <h2>Users</h2>
    <table id="users" aria-label="Users">
      <thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
      <tbody>
        <tr><td>Ada Lovelace</td><td>ada@example.com</td><td><button class="edit">Edit</button> <button class="del">Delete</button></td></tr>
        <tr><td>Grace Hopper</td><td>grace@example.com</td><td><button class="edit">Edit</button> <button class="del">Delete</button></td></tr>
        <tr><td>Alan Turing</td><td>alan@example.com</td><td><button class="edit">Edit</button> <button class="del">Delete</button></td></tr>
      </tbody>
    </table>
    <p id="user-action"></p>
  </section>
  <section>
    <h2>Activity feed</h2>
    <ul id="feed"><li>Feed item 1</li></ul>
    <button id="load-more">Load More</button>
  </section>
</main>
<footer><a href="#" id="terms">Terms</a><a href="#">Privacy</a><span>Version 0.1.6</span></footer>
<script>
const user = localStorage.getItem("user") || "guest";
document.getElementById("welcome").textContent = "Welcome, " + user;
if (user === "ada") document.getElementById("role").value = "admin";
document.getElementById("logout").onclick = () => { localStorage.removeItem("user"); location.href = "/index.html"; };
document.querySelectorAll("#users tbody tr").forEach((tr) => {
  const name = tr.cells[0].textContent;
  tr.querySelector(".edit").onclick = () => { document.getElementById("user-action").textContent = "Editing " + name; };
  tr.querySelector(".del").onclick = () => { if (confirm("Delete " + name + "?")) { tr.remove(); document.getElementById("user-action").textContent = "Deleted " + name; } };
});
let pages = 1;
document.getElementById("load-more").onclick = () => {
  pages += 1;
  const li = document.createElement("li"); li.textContent = "Feed item " + pages;
  document.getElementById("feed").appendChild(li);
  if (pages >= 4) document.getElementById("load-more").remove();
};
</script>
</body></html>
