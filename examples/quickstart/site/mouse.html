<!doctype html>
<html><head><meta charset="utf-8"><title>Mouse and keyboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Manul Quickstart</strong><a href="index.html">Home</a></header>
<main>
  <section>
    <h2>Mouse</h2>
    <span id="avatar" aria-label="Avatar">Avatar</span> <span id="tip" class="hidden">Signed in as Manul</span>
    <p><button id="copy">Copy link</button> <span id="copy-status"></span></p>
    <div id="area" aria-label="File area" style="padding:16px;background:#eee">Right-click a file here</div>
    <div id="menu" class="menu hidden"><button id="rename">Rename</button></div>
    <p id="menu-status"></p>
  </section>
  <section>
    <h2>Board</h2>
    <div class="column" aria-label="To do"><div class="tile">Write tests</div><div class="tile">Fix the build</div></div>
    <div class="column" id="done" aria-label="Done"></div>
    <p id="board-status"></p>
  </section>
  <section>
    <h2>Keyboard</h2>
    <label for="search">Search</label><input id="search">
    <p id="search-status"></p>
    <button id="open">Open dialog</button>
    <div id="dialog" class="hidden" role="dialog"><p>Dialog is open</p></div>
  </section>
  <section>
    <h2>Browser dialogs</h2>
    <button id="delete">Delete account</button>
    <p id="delete-status"></p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("avatar").addEventListener("mouseenter", () => $("tip").classList.remove("hidden"));
$("copy").ondblclick = () => { $("copy-status").textContent = "Link copied"; };
$("area").addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const m = $("menu"); m.style.left = e.pageX + "px"; m.style.top = e.pageY + "px"; m.classList.remove("hidden");
});
$("rename").onclick = () => { $("menu").classList.add("hidden"); $("menu-status").textContent = "Renamed"; };

// A pointer-driven board, the way most kanban widgets are built.
let dragging = null;
document.querySelectorAll(".tile").forEach((t) => t.addEventListener("mousedown", () => { dragging = t; }));
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  const tile = dragging; dragging = null;
  const r = $("done").getBoundingClientRect();
  if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
    $("done").appendChild(tile); $("board-status").textContent = tile.textContent + " moved to Done";
  }
});

$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("search-status").textContent = "Results for " + $("search").value;
});
$("open").onclick = () => $("dialog").classList.remove("hidden");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("dialog").classList.add("hidden"); });

// confirm() blocks the page until someone answers; Manul answers OK.
$("delete").onclick = () => { $("delete-status").textContent = confirm("Really delete?") ? "Account deleted" : "Kept"; };
</script>
</body></html>
