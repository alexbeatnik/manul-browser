<!doctype html>
<html><head><meta charset="utf-8"><title>Login</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Manul Quickstart</strong><a href="index.html">Home</a><button id="logout" class="hidden">Logout</button></header>
<main>
  <section id="login">
    <h1>Sign in</h1>
    <label for="user">Username</label><input id="user" autocomplete="off">
    <label for="pass">Password</label><input id="pass" type="password">
    <p><input type="checkbox" id="remember"><label for="remember" style="display:inline">Remember me</label></p>
    <button id="signin">Sign in</button>
    <p id="error" class="error"></p>
  </section>
  <section id="account" class="hidden">
    <h1 id="welcome"></h1>
    <label for="role">Role</label><input id="role" readonly>
  </section>
</main>
<script>
// No backend: the accounts live here so the page works from any static server.
const USERS = { ada: { password: "lovelace", role: "admin" }, grace: { password: "hopper", role: "member" } };
const $ = (id) => document.getElementById(id);
$("signin").onclick = () => {
  const u = USERS[$("user").value];
  if (!u || u.password !== $("pass").value) { $("error").textContent = "Invalid username or password"; return; }
  $("error").textContent = "";
  $("welcome").textContent = "Welcome, " + $("user").value;
  $("role").value = u.role;
  $("login").classList.add("hidden");
  $("account").classList.remove("hidden");
  $("logout").classList.remove("hidden");
};
$("logout").onclick = () => {
  $("user").value = ""; $("pass").value = "";
  $("account").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("login").classList.remove("hidden");
};
</script>
</body></html>
