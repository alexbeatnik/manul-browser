<!doctype html><html><head><title>Opener</title></head>
<body style="font-family:sans-serif">
<h1>Shop front</h1>
<p><a href="product.html" target="_blank">Open the product</a></p>
<p><a href="product.html" target="_blank" rel="noopener">Open without opener</a></p>
<p><button onclick="window.open('signin.html', 'signin', 'width=400,height=300')">Sign in with a popup</button></p>
<p><button onclick="setTimeout(function () { window.open('product.html'); }, 800)">Open the product later</button></p>
<p id="status">Signed out</p>
<script>
window.addEventListener('message', function (e) {
  if (e.data && e.data.user) document.getElementById('status').textContent = 'Signed in as ' + e.data.user;
});
</script>
</body></html>
