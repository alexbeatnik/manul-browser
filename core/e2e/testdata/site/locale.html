<!doctype html><html><head><meta charset="utf-8"><title>Locale</title></head>
<body style="font-family:sans-serif">
<p id="nav">navigator: ?</p>
<p id="hdr">header: ?</p>
<script>
document.getElementById('nav').textContent = 'navigator: ' + navigator.language;
fetch('/echo-lang').then(function (r) { return r.text(); }).then(function (t) {
  document.getElementById('hdr').textContent = 'header: ' + t;
});
</script>
</body></html>
