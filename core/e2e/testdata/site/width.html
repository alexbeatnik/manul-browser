<!doctype html><html><head><title>Window width</title></head>
<body style="font-family:sans-serif">
<!-- browser_args reaches the browser: a run with --window-size=1000,700
     sees a page 1000 wide. -->
<p id="w"></p>
<script>document.getElementById('w').textContent = 'Width ' + window.innerWidth;</script>
</body></html>
